<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/historial"></ion-back-button>
    </ion-buttons>
    <ion-title>Exámenes Médicos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content #pageContent [fullscreen]="true" scrollEvents="true" (ionScroll)="onScroll($event)">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Exámenes</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="health-container" *ngIf="paciente">
    <!-- Estadísticas mejoradas -->
    <div class="stats-section" *ngIf="totalExamenes > 0">
      <div class="section-header">
        <h3>Resumen Médico</h3>
      </div>
      
      <div class="enhanced-stats-grid">
        <ion-card class="stat-card total">
          <ion-card-content>
            <div class="stat-icon">
              <ion-icon name="medical"></ion-icon>
            </div>
            <div class="stat-number">{{ totalExamenes }}</div>
            <div class="stat-label">Total Exámenes</div>
          </ion-card-content>
        </ion-card>

        <ion-card class="stat-card recent">
          <ion-card-content>
            <div class="stat-icon">
              <ion-icon name="time"></ion-icon>
            </div>
            <div class="stat-number">{{ examenesRecientes }}</div>
            <div class="stat-label">Recientes (3m)</div>
          </ion-card-content>
        </ion-card>
      </div>
    </div>

    <!-- Acciones rápidas -->
    <div class="quick-actions-section" *ngIf="totalExamenes > 0">
      <div class="actions-row">       
        <ion-button 
          fill="clear" 
          size="small" 
          class="action-btn sort-btn"
          (click)="sortExamenes()">
          <ion-icon name="swap-vertical" slot="start"></ion-icon>
          Ordenar
        </ion-button>
        
        <ion-button 
          fill="solid" 
          size="small" 
          class="action-btn add-btn"
          (click)="addExamen()">
          <ion-icon name="add" slot="start"></ion-icon>
          Nuevo
        </ion-button>
      </div>
    </div>

    <!-- Lista de examenes -->
    <div class="examenes-section">
      <!-- spinner inicial opcional (overlay) -->
      <div class="initial-loader" *ngIf="initialLoading">
        <ion-spinner name="crescent"></ion-spinner>
      </div>

      <!-- Estado vacío -->
      <div class="empty-state" *ngIf="!initialLoading && totalExamenes === 0">
        <div class="empty-icon">
          <ion-icon name="flask-outline"></ion-icon>
        </div>
        <h3>No hay exámenes registrados</h3>
        <p>Aún no se han registrado exámenes médicos para este paciente.</p>
        <ion-button fill="solid" (click)="addExamen()">
          <ion-icon name="add" slot="start"></ion-icon>
          Registrar primer examen
        </ion-button>
      </div>

      <div class="examenes-list" *ngIf="totalExamenes > 0">
        <app-examen-card
          *ngFor="let exam of examenes; trackBy: trackByExamen; let i = index"
          [examen]="exam"
          [index]="i"
          class="examen-item">
        </app-examen-card>
      </div>

      <!-- Infinite scroll -->
      <ion-infinite-scroll
        *ngIf="totalExamenes > 0"
        threshold="100px"
        (ionInfinite)="loadMore($event)"
        [disabled]="!hasMore">
        <ion-infinite-scroll-content
          loadingSpinner="crescent"
          loadingText="Cargando más exámenes...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>
    </div>
  </div>
  
  <ion-fab
    vertical="bottom"
    horizontal="end"
    slot="fixed"
    [class.visible]="showScrollTop">
    <ion-fab-button class="scroll-top-btn" (click)="scrollToTop()">
      <ion-icon name="arrow-up-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
