<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/perfil" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Editar Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="edit-profile-content">
  
  <!-- Avatar Section -->
  <div class="avatar-section">
    <div class="avatar-container">
      <div class="current-avatar">
        {{ getInitials() }}
      </div>
      <ion-button fill="clear" class="change-avatar-btn" (click)="cambiarAvatar()">
        <ion-icon name="camera" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
    <p class="avatar-text">Toca para cambiar foto</p>
  </div>

  <!-- Formulario -->
  <div class="form-container">
    <form class="edit-form" (ngSubmit)="guardarCambios()">
      
      <!-- Información Personal -->
      <div class="form-section">
        <h3 class="section-title">Información Personal</h3>
        
        <!-- Nombre -->
        <div class="form-group">
          <ion-item class="form-input" lines="none">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-input
              [(ngModel)]="formData.nombre"
              name="nombre"
              label="Nombre completo"
              labelPlacement="floating"
              placeholder="Ingresa tu nombre"
              required>
            </ion-input>
          </ion-item>
        </div>

        <!-- RUT -->
        <div class="form-group">
          <ion-item class="form-input disabled" lines="none">
            <ion-icon name="card-outline" slot="start"></ion-icon>
            <ion-input
              [(ngModel)]="formData.Rut"
              name="Rut"
              label="RUT"
              labelPlacement="floating"
              placeholder="12.345.678-9"
              readonly>
            </ion-input>
            <ion-icon name="lock-closed" slot="end" class="lock-icon"></ion-icon>
          </ion-item>
          <p class="input-help">
            <ion-icon name="information-circle-outline"></ion-icon>
            El RUT no se puede modificar
          </p>
        </div>

        <!-- Fecha de Nacimiento -->
        <div class="form-group">
          <ion-item class="form-input date-input" lines="none">
            <ion-icon name="calendar-outline" slot="start"></ion-icon>
            <div class="date-field">
              <ion-label class="date-label">Fecha de nacimiento</ion-label>
              <ion-datetime-button datetime="fecha-nacimiento" class="date-button"></ion-datetime-button>
            </div>
          </ion-item>
          
          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime
                id="fecha-nacimiento"
                [(ngModel)]="formData.fechaNacimiento"
                name="fechaNacimiento"
                presentation="date"
                [max]="maxDate"
                [min]="minDate"
                [showDefaultButtons]="true"
                doneText="Confirmar"
                cancelText="Cancelar">
              </ion-datetime>
            </ng-template>
          </ion-modal>
        </div>

        <!-- Sexo -->
        <div class="form-group">
          <ion-item class="form-input" lines="none">
            <ion-icon name="male-female-outline" slot="start"></ion-icon>
            <ion-select
              [(ngModel)]="formData.sexo"
              name="sexo"
              label="Sexo"
              labelPlacement="floating"
              placeholder="Seleccionar"
              interface="popover">
              <ion-select-option value="Masculino">Masculino</ion-select-option>
              <ion-select-option value="Femenino">Femenino</ion-select-option>
              <ion-select-option value="Otro">Otro</ion-select-option>
            </ion-select>
          </ion-item>
        </div>

        <!-- Tipo de Sangre -->
        <div class="form-group">
          <ion-item class="form-input" lines="none">
            <ion-icon name="water-outline" slot="start"></ion-icon>
            <ion-select
              [(ngModel)]="formData.tipoSangre"
              name="tipoSangre"
              label="Tipo de sangre"
              labelPlacement="floating"
              placeholder="Seleccionar"
              interface="popover">
              <ion-select-option value="A+">A+</ion-select-option>
              <ion-select-option value="A-">A-</ion-select-option>
              <ion-select-option value="B+">B+</ion-select-option>
              <ion-select-option value="B-">B-</ion-select-option>
              <ion-select-option value="AB+">AB+</ion-select-option>
              <ion-select-option value="AB-">AB-</ion-select-option>
              <ion-select-option value="O+">O+</ion-select-option>
              <ion-select-option value="O-">O-</ion-select-option>
            </ion-select>
          </ion-item>
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="form-actions">
        <ion-button 
          expand="block" 
          type="submit"
          class="save-button"
          [disabled]="isLoading">
          <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
          <span *ngIf="!isLoading">Guardar Cambios</span>
          <span *ngIf="isLoading" class="loading-content">
            <ion-spinner name="crescent"></ion-spinner>
            Guardando...
          </span>
        </ion-button>

        <ion-button 
          expand="block" 
          fill="outline"
          color="medium"
          class="cancel-button"
          (click)="cancelarEdicion()"
          [disabled]="isLoading">
          <ion-icon name="close-circle-outline" slot="start"></ion-icon>
          Cancelar
        </ion-button>
      </div>

    </form>
  </div>

</ion-content>
