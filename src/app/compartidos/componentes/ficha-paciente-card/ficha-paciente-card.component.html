<ion-card class="modern-profile-card" [class.editing]="isEditing" *ngIf="paciente">
  
  <!-- Header con avatar y nombre -->
  <div class="profile-header">
    <div class="header-background"></div>
    <div class="header-content">
      <div class="avatar-section">
        <div class="avatar-wrapper">
          <div class="avatar-circle">
            {{ getInitials(paciente.nombre) }}
          </div>
          <div class="avatar-status"></div>
        </div>
      </div>
      <div class="name-section">
        <ng-container *ngIf="!isEditing">
          <h2 class="patient-name">{{ paciente.nombre || 'Paciente' }}</h2>
          <p class="patient-id">RUT: {{ paciente.Rut }}</p>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" *ngIf="isSaving">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Guardando cambios...</p>
  </div>

  <!-- Grid de información -->
  <div class="profile-body">
    <div class="info-cards-grid">
      
      <!-- Card Edad -->
      <div class="info-mini-card age-card">
        <div class="card-icon">
          <ion-icon name="calendar"></ion-icon>
        </div>
        <div class="card-content">
          <ng-container *ngIf="!isEditing">
            <span class="card-value">{{ displayAge }}</span>
            <span class="card-label">Edad</span>
          </ng-container>
        </div>
      </div>

      <!-- Card Sexo -->
      <div class="info-mini-card gender-card">
        <div class="card-icon">
          <ion-icon name="person"></ion-icon>
        </div>
        <div class="card-content">
          <ng-container *ngIf="!isEditing">
            <span class="card-value">{{ displaySex }}</span>
            <span class="card-label">Sexo</span>
          </ng-container>
        </div>
      </div>

      <!-- Card Grupo Sanguíneo -->
      <div class="info-mini-card blood-card">
        <div class="card-icon">
          <ion-icon name="water"></ion-icon>
        </div>
        <div class="card-content">
          <ng-container *ngIf="!isEditing">
            <span class="card-value">{{ displayBloodType }}</span>
            <span class="card-label">Grupo</span>
          </ng-container>
        </div>
      </div>
    </div>
  </div>

</ion-card>
