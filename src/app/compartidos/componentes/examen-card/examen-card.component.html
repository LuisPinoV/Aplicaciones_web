<ion-card *ngIf="examen" class="examen-card">
  <div class="card-header">
    <div class="examen-meta">
      <div class="examen-date">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>{{ examen.fechaExamen | date:'MMM d, y' }}</span>
      </div>
    </div>

    <div class="card-actions">
      <ion-button fill="clear" size="small" class="more-btn" (click)="onMoreOptions()">
        <ion-icon name="ellipsis-vertical" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </div>

  <ion-card-content class="card-body">
    <div class="examen-details">
      <div class="detail-item">
        <ion-icon name="time-outline"></ion-icon>
        <div class="detail-content">
          <span class="detail-label">Tiempo transcurrido</span>
          <span class="detail-value">{{ getTiempoTranscurrido() }}</span>
        </div>
      </div>

      <div class="detail-item" *ngIf="examen.nombreExamen">
        <ion-icon name="document-text-outline"></ion-icon>
        <div class="detail-content">
          <span class="detail-label">Nombre</span>
          <span class="detail-value">{{ examen.nombreExamen }}</span>
        </div>
      </div>

      <div class="detail-item" *ngIf="examen.descripcionExamen">
        <ion-icon name="document-text-outline"></ion-icon>
        <div class="detail-content">
          <span class="detail-label">Descripción</span>
          <span class="detail-value">{{ examen.descripcionExamen }}</span>
        </div>
      </div>
    </div>
  </ion-card-content>
</ion-card>
