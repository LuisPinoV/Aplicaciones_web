<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()" fill="clear">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nuevo Diagnostico</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-container">
    <!-- Sección de información básica -->
    <div class="section-card">
      <div class="section-header">
        <ion-icon name="medical-outline"></ion-icon>
        <h3>Información del Diagnostico</h3>
      </div>

      <div class="form-group">
        <ion-item lines="none" class="custom-item">
          <ion-label position="stacked" class="custom-label">
            <ion-icon name="calendar-outline" class="label-icon"></ion-icon>
            Fecha del Diagnostico
          </ion-label>
          <ion-datetime 
            [(ngModel)]="fecha" 
            presentation="date"
            [max]="maxDate"
            class="custom-datetime">
          </ion-datetime>
        </ion-item>

        <ion-item lines="none" class="custom-item textarea-item">
          <ion-label position="stacked" class="custom-label">
            <ion-icon name="document-text-outline" class="label-icon"></ion-icon>
            Descripción
          </ion-label>
          <ion-textarea 
            [(ngModel)]="descripcion" 
            placeholder="Agrega notas sobre el diagnostico..."
            rows="3"
            class="custom-textarea">
          </ion-textarea>
        </ion-item>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border modal-footer">
  <ion-toolbar>
    <div class="footer-buttons">
      <ion-button 
        fill="clear" 
        color="medium" 
        (click)="cancelar()"
        class="cancel-btn">
        Cancelar
      </ion-button>
      <ion-button 
        fill="solid" 
        (click)="guardarDiagnostico()"
        [disabled]="descripcion.length === 0"
        class="save-btn">
        <ion-icon name="checkmark" slot="start"></ion-icon>
        Guardar Diagnostico
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
