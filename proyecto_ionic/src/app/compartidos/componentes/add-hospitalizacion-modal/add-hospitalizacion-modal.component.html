<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()" fill="clear">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nueva Hospitalización</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-container">
    <!-- Sección de información básica -->
    <div class="section-card">
      <div class="section-header">
        <ion-icon name="medical-outline"></ion-icon>
        <h3>Información de la Hospitalización</h3>
      </div>

      <div class="form-group">
        <!-- Fecha -->
        <ion-item lines="none" class="custom-item">
          <ion-label position="stacked" class="custom-label">
            <ion-icon name="calendar-outline" class="label-icon"></ion-icon>
            Fecha de Ingreso
          </ion-label>
          <ion-datetime 
            [(ngModel)]="fecha" 
            presentation="date"
            [max]="maxDate"
            display-format="DD/MM/YYYY"
            picker-format="DD MMMM YYYY"
            cancel-text="Cancelar"
            done-text="Aceptar"
            class="custom-datetime">
          </ion-datetime>
        </ion-item>

        <!-- Institución Médica -->
        <ion-item lines="none" class="custom-item">
          <ion-label position="stacked" class="custom-label">
            <ion-icon name="business-outline" class="label-icon"></ion-icon>
            Institución Médica
          </ion-label>
          <ion-input 
            [(ngModel)]="institucionMedica" 
            type="text"
            placeholder="Ej: Hospital Regional"
            maxlength="200"
            clear-input="true"
            class="custom-input">
          </ion-input>
        </ion-item>

        <!-- Duración -->
        <ion-item lines="none" class="custom-item">
          <ion-label position="stacked" class="custom-label">
            <ion-icon name="time-outline" class="label-icon"></ion-icon>
            Duración (días)
          </ion-label>
          <ion-input 
            [(ngModel)]="duracion" 
            type="number"
            min="1"
            placeholder="Ej: 7"
            class="custom-input">
          </ion-input>
        </ion-item>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border modal-footer">
  <ion-toolbar>
    <div class="footer-buttons">
      <ion-button 
        fill="clear" 
        color="medium" 
        (click)="cancelar()"
        class="cancel-btn">
        Cancelar
      </ion-button>
      <ion-button 
        fill="solid" 
        (click)="guardarHospitalizacion()"
        [disabled]="!formularioValido()"
        class="save-btn">
        <ion-icon name="checkmark" slot="start"></ion-icon>
        Guardar Hospitalización
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
