<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()" fill="clear">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nuevo Examen</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="modal-container">
    <!-- Sección de información básica -->
    <div class="section-card">
      <div class="section-header">
        <ion-icon name="medical-outline"></ion-icon>
        <h3>Información del Examen</h3>
      </div>

      <div class="form-group">
        <ion-item lines="none" class="custom-item">
          <ion-label position="stacked" class="custom-label">
            <ion-icon name="flask-outline" class="label-icon"></ion-icon>
            Tipo de Examen
          </ion-label>
          <ion-select 
            [(ngModel)]="examenSeleccionado" 
            (ionChange)="loadResultadosEsperados()"
            interface="action-sheet"
            placeholder="Selecciona un examen"
            class="custom-select">
            <ion-select-option *ngFor="let examen of examenesDisponibles" [value]="examen">
              {{ examen.nombreExamen }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item lines="none" class="custom-item">
          <ion-label position="stacked" class="custom-label">
            <ion-icon name="calendar-outline" class="label-icon"></ion-icon>
            Fecha del Examen
          </ion-label>
          <ion-datetime 
            [(ngModel)]="fechaExamen" 
            presentation="date"
            [max]="maxDate"
            class="custom-datetime">
          </ion-datetime>
        </ion-item>

        <ion-item lines="none" class="custom-item textarea-item">
          <ion-label position="stacked" class="custom-label">
            <ion-icon name="document-text-outline" class="label-icon"></ion-icon>
            Descripción (Opcional)
          </ion-label>
          <ion-textarea 
            [(ngModel)]="descripcion" 
            placeholder="Agrega notas sobre el examen..."
            rows="3"
            class="custom-textarea">
          </ion-textarea>
        </ion-item>
      </div>
    </div>

    <!-- Sección de resultados -->
    <div class="section-card" *ngIf="resultados.length > 0">
      <div class="section-header">
        <ion-icon name="analytics-outline"></ion-icon>
        <h3>Resultados del Examen</h3>
      </div>

      <div class="results-grid">
        <div class="result-card" *ngFor="let resultado of resultados; let i = index">
          <div class="result-header">
            <span class="result-number">{{ i + 1 }}</span>
            <p class="result-name">{{ resultado.nombre }}</p>
          </div>
          
          <div class="result-inputs">
            <div class="input-wrapper valor-input">
              <ion-input 
                [(ngModel)]="resultado.valor" 
                placeholder="0.00" 
                type="number"
                step="0.01"
                class="custom-input">
              </ion-input>
            </div>
            
            <div class="input-wrapper formato-input">
              <ion-select 
                [(ngModel)]="resultado.formato" 
                interface="popover"
                class="formato-select">
                <ion-select-option value="mg/dL">mg/dL</ion-select-option>
                <ion-select-option value="g/dL">g/dL</ion-select-option>
                <ion-select-option value="mmol/L">mmol/L</ion-select-option>
                <ion-select-option value="U/L">U/L</ion-select-option>
                <ion-select-option value="mg">mg</ion-select-option>
                <ion-select-option value="g">g</ion-select-option>
                <ion-select-option value="%">%</ion-select-option>
              </ion-select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Estado vacío cuando no hay examen seleccionado -->
    <div class="empty-state" *ngIf="!examenSeleccionado">
      <ion-icon name="flask-outline" class="empty-icon"></ion-icon>
      <p>Selecciona un tipo de examen para comenzar</p>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border modal-footer">
  <ion-toolbar>
    <div class="footer-buttons">
      <ion-button 
        fill="clear" 
        color="medium" 
        (click)="cancelar()"
        class="cancel-btn">
        Cancelar
      </ion-button>
      <ion-button 
        fill="solid" 
        (click)="guardarExamen()"
        [disabled]="!examenSeleccionado || resultados.length === 0"
        class="save-btn">
        <ion-icon name="checkmark" slot="start"></ion-icon>
        Guardar Examen
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
