<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Fichas Médicas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Fichas Médicas</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Indicador de carga -->
  <div *ngIf="isLoading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando fichas...</p>
  </div>

  <!-- Lista de fichas médicas -->
  <ion-list *ngIf="!isLoading && (fichasmedicas?.length ?? 0) > 0">
    <ion-item *ngFor="let ficha of fichasmedicas; trackBy: trackById">
      <ion-label>
        <p>{{ ficha.idFichaMedica }}</p>
        <h2>{{ ficha.nombre }}</h2>
        <p>RUT: {{ ficha.Rut }}</p>
        <p>Fecha de Nacimiento: {{ ficha.fechaNacimiento | date:'dd/MM/yyyy' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Scroll infinito: carga más fichas al llegar al final -->
  <ion-infinite-scroll
    threshold="100px"
    (ionInfinite)="loadFichasMedicas($event)"
    [disabled]="allDataLoaded"
  >
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Cargando más fichas..."
    ></ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <div *ngIf="!isLoading && fichasmedicas?.length === 0" class="ion-text-center ion-padding">
    <p>No se encontraron fichas médicas.</p>
  </div>

</ion-content>
